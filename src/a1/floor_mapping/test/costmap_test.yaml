global_frame: odom
robot_base_frame: base
update_frequency: 10.0
publish_frequency: 10.0
always_send_full_costmap: true
transform_tolerance: 1.0
rolling_window: false
width: 8.0
height: 8.0
resolution: 0.05
origin_x: -4.0
origin_y: -4.0
footprint: '[[0.25,0.18],[0.25,-0.18],[-0.25,-0.18],[-0.25,0.18]]'
plugins:
  - {name: obstacles, type: costmap_2d::ObstacleLayer}
obstacles:
  observation_sources: mapping_marking mapping_clearing
  mapping_marking:
    topic: /test/costmap/mapping_cloud
    data_type: PointCloud2
    marking: true
    clearing: false
    min_obstacle_height: -0.10
    max_obstacle_height: 1.8
    obstacle_range: 6.0
    raytrace_range: 7.0
    observation_persistence: 0.0
    expected_update_rate: 0.0
  mapping_clearing:
    topic: /test/costmap/clearing_cloud
    data_type: PointCloud2
    marking: false
    clearing: true
    min_obstacle_height: -0.60
    max_obstacle_height: 1.8
    obstacle_range: 6.0
    raytrace_range: 7.0
    observation_persistence: 0.0
    expected_update_rate: 0.0
