# Load under an ObstacleLayer. Both sources intentionally consume the same cloud.
observation_sources: mapping_marking mapping_clearing
mapping_marking:
  topic: /a1/floor_mapping/obstacle_cloud
  data_type: PointCloud2
  sensor_frame: laser_livox
  marking: true
  clearing: false
  min_obstacle_height: 0.08
  max_obstacle_height: 1.50
  obstacle_range: 8.0
mapping_clearing:
  topic: /a1/floor_mapping/obstacle_cloud
  data_type: PointCloud2
  sensor_frame: laser_livox
  marking: false
  clearing: true
  min_obstacle_height: -0.10
  max_obstacle_height: 1.50
  raytrace_range: 8.0
