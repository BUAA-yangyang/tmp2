frames: {odom: odom, base: base, sensor: laser_livox}
topics:
  pointcloud: /a1_localization/livox_pointcloud
  odom: /a1/localization/odom
  localization_status: /a1/localization/status
  supervisor_status: /a1/localization/supervisor_status
  # Obstacle-only returns, classified by height relative to the tracked floor.
  # Costmap marking must consume this topic so a raised support surface is not
  # reinterpreted as an obstacle by an absolute world-z threshold.
  marking_cloud: /a1/floor_mapping/marking_cloud
  # Backward-compatible ground+obstacle cloud. Keep it for clearing rays and
  # existing visualization/diagnostics consumers; do not use it for marking.
  obstacle_cloud: /a1/floor_mapping/obstacle_cloud
  occupancy_grid: /a1/floor_mapping/map
  status: /a1/floor_mapping/status
  diagnostics: /a1/floor_mapping/diagnostics
timeouts:
  # Point clouds and the localization TF for the same sensor stamp travel
  # through different processing chains. Queue clouds until their exact TF is
  # available; ROS time bounds normal simulation progress and wall time bounds
  # a frozen simulator/process.
  tf_queue_ros: 0.30
  tf_queue_wall: 2.0
  tf_queue_poll_wall: 0.01
  input_degraded: 1.0
  input_lost: 3.0
queues: {pointcloud: 10}
recovery: {valid_frames: 3}
ground:
  search_radius: 2.5
  min_relative_z: -0.8
  max_relative_z: 0.15
  minimum_candidates: 80
  # Applied to initialization and unsupported-new-floor candidates. Once a
  # floor is ready, its local height band uses minimum_candidates as an
  # absolute support threshold so nearby walls do not dilute floor coverage.
  minimum_inlier_ratio: 0.20
  maximum_dispersion: 0.08
  initialization_frames: 6
  maximum_frame_delta: 0.08
  unsupported_floor_delta: 0.35
  floor_change_frames: 10
  invalid_frame_tolerance: 3
filter:
  self_clear_radius: 0.45
  minimum_range: 0.5
  maximum_range: 8.0
  ground_band_below: 0.05
  ground_clearance: 0.08
  maximum_obstacle_height: 1.50
  voxel_leaf_size: 0.05
grid:
  resolution: 0.05
  width: 40.0
  height: 40.0
  publish_rate: 1.0
  p_free: 0.35
  p_occupied: 0.80
  minimum_observations: 2
services: {reset: /a1/floor_mapping/reset}
