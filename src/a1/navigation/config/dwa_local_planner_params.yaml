DWAPlannerROS:
  # ============================================================
  # 速度上限：必须匹配 A1 的 RL 策略训练范围，不能照抄官方 unitree_move_base
  # （那份是 Go1 + MPC 步态：vx 0.5 / vy 0.5 / wz 1.2，且 min_vel_x: 0.3 禁止慢速）
  # A1 的 RL 策略训练用的键盘 scale 在 State_RL_test.h:99-101 —— vx 0.6 / vy 0.35 / wz 0.9
  # 超出这个范围策略没见过，会步态发散摔倒。下面取约 2/3 留安全余量。
  # ============================================================
  max_vel_x: 1.40
  min_vel_x: 0.0          # 室内导航前进/原地转向优先，禁止无限倒车跟随全局路径
  max_vel_y: 0.25         # 四足可横移，A1 的 RL 策略吃 linear.y
  min_vel_y: -0.25
  max_vel_trans: 1.40     # 对齐已实测 State_RL 参考项目的速度上限
  # 实测的 A1 关键特性：RL 策略有"有效速度死区"。
  # 指令 0.25m/s 正常行走；0.18m/s 及以下狗原地踏步、净位移≈0（实测 0.14 和 0.18 都走不动）。
  # DWA 快到目标时会自然降速，一旦掉进死区就卡住，接着被判振荡去做恢复旋转。
  # State_RL 在约 0.15 m/s 附近仍可能保持原地，室内平移下限需越过策略死区。
  # 效果是"要么以能走动的速度走，要么干脆停"，不再出现"发得出去但走不动"的中间态。
  min_vel_trans: 0.35
  max_vel_theta: 1.80
  min_vel_theta: 0.75

  # ============================================================
  # 必须设：DWA 从这个话题读"当前速度"，用来算可达速度窗口。
  # 默认值是 "odom"，而本仿真的里程计话题叫 /Odometry_gazebo（无 /odom）。
  # 漏了这一行的后果很隐蔽：DWA 永远以为当前速度=0，可达窗口只有 ±acc_lim*dt，
  # 于是 /cmd_vel_nav 被永久钉在 0.1m/s 左右、永远升不上去，狗原地不动，
  # 接着 move_base 判定振荡去做恢复旋转 —— 看起来像"规划器坏了"，其实是缺一个话题名。
  # 后期换 a1_localization 的 FAST-LIO2 时，改 navigation.launch 的 odom_topic 参数即可。
  # ============================================================
  odom_topic: /a1/localization/odom

  # 加速度限制。注意：这不是"越小越平滑越好"。
  # RL 步态本身就是一个速度跟踪控制器，直接给阶跃速度指令也能正常起步
  # （实测直接 pub vx=0.25 立刻正常行走）。而 DWA 每周期只能在
  # 当前速度 ±acc_lim*dt(=0.1s) 的窗口里采样，acc_lim 给太小会让起步极慢，
  # 甚至因为指令小于 RL 策略的有效死区而根本走不起来。
  acc_lim_x: 4.0
  acc_lim_y: 3.0
  acc_lim_theta: 6.0
  acc_lim_trans: 4.0

  # ---- 目标容差 ----
  # 四足 RL 行走的落点精度本来就不高，容差给太小会在目标点附近反复抖动出不来。
  # 又因为上面的速度死区，最后 0.2~0.3m 基本"挪不动"，容差必须留够，
  # 否则永远判不了到达，白白触发恢复行为。0.35m 对"走到房间某处去看一眼"这类
  # 探索型目标完全够用；真需要精确对位（比如进电梯）由 a1_building_behavior 负责。
  # 0.35 实测偏紧：狗常停在 0.37~0.38m 处（差一点点判不了到达），然后掉进速度死区
  # 干等到触发恢复旋转。容差必须大于"最后一步走不动"的残差，取 0.45。
  xy_goal_tolerance: 0.45
  # yaw 也受速度死区影响：角速度指令太小时狗原地不动，最后几度对不齐。
  # 实测 0.60(34°) 偏紧，狗在 -35°~+30° 之间来回摆、判不了到达，最后触发恢复旋转。
  # 探索型目标不关心最终朝向，放宽到 0.80(46°)。需要精确对位（进电梯、过窄门）
  # 由 a1_building_behavior 负责，不该指望通用导航做到。
  yaw_goal_tolerance: 0.80
  latch_xy_goal_tolerance: true   # 一旦进入位置容差就锁定，只原地调朝向，不再来回挪

  # ---- 轨迹采样 ----
  # 原理：DWA 在"当前速度 ± 加速度*dt"的可达速度窗口里撒一批候选速度，
  # 每个候选按 sim_time 前推一条轨迹，再用下面的打分项挑最优。
  sim_time: 2.0             # 前推 2s；太长在窄走廊里容易全部撞墙无解，太短看不见转弯
  sim_granularity: 0.05
  angular_sim_granularity: 0.05
  vx_samples: 12
  vy_samples: 8             # 有横移能力才需要采样 y
  vth_samples: 20

  # ---- 打分权重 ----
  path_distance_bias: 32.0  # 越大越贴着全局路径走
  goal_distance_bias: 20.0  # 越大越"想直奔目标"
  occdist_scale: 0.05       # 越大越怕障碍；太大会在窄门口不敢过
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # ---- 振荡抑制 ----
  oscillation_reset_dist: 0.10
  oscillation_reset_angle: 0.30

  # 用 costmap 转换后的米制打分（而不是栅格数），参数含义才和上面的物理量一致
  publish_cost_grid_pc: false
  prune_plan: true
