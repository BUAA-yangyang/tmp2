local_costmap:
  # 局部代价地图：只关心机器人周围一小块，给局部规划器做避障用。
  # 必须和 global 同一个 global_frame，否则两者对不上。
  global_frame: odom
  robot_base_frame: base

  static_map: false
  rolling_window: true
  width: 5.0                # 5x5m 足够覆盖 DWA 的前瞻距离(sim_time * max_vel)
  height: 5.0
  resolution: 0.05

  update_frequency: 5.0     # 局部图要比全局图刷得快，避障才跟得上
  publish_frequency: 2.0
  transform_tolerance: 0.5

  plugins:
    - {name: obstacle_layer,  type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}

  inflation_layer:
    inflation_radius: 0.25
    cost_scaling_factor: 5.0
