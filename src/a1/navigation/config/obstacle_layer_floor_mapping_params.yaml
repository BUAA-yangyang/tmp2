# floor_mapping publishes ground and obstacle returns in the real Livox sensor
# frame.  Separate sources allow obstacle marking to reject ground while
# clearing still uses ground rays and the correct sensor origin.
obstacle_range: 4.0
raytrace_range: 5.0
track_unknown_space: false
combination_method: 1
observation_sources: mapping_marking mapping_clearing

mapping_marking:
  data_type: PointCloud2
  topic: /a1_nav/obstacle_cloud
  sensor_frame: laser_livox
  marking: true
  clearing: false
  inf_is_valid: false
  expected_update_rate: 0.0
  observation_persistence: 0.0
  min_obstacle_height: 0.08
  max_obstacle_height: 1.50
  obstacle_range: 4.0

mapping_clearing:
  data_type: PointCloud2
  topic: /a1_nav/obstacle_cloud
  sensor_frame: laser_livox
  marking: false
  clearing: true
  inf_is_valid: false
  expected_update_rate: 0.0
  observation_persistence: 0.0
  min_obstacle_height: -0.10
  max_obstacle_height: 1.50
  raytrace_range: 5.0
