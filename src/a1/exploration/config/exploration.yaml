frames:
  base: base

topics:
  map: /a1/floor_mapping/map
  doorways: /a1/floor_mapping/doorways
  mapping_status: /a1/floor_mapping/status
  final_cmd_vel: /cmd_vel
  safety_lock: /a1_cmd_mux/safety_lock
  controller_ready: /a1/controller_ready
  status: /a1/exploration/status
  frontiers: /a1/exploration/frontiers
  selected_target: /a1/exploration/selected_target
  failed_targets: /a1/exploration/failed_targets
  trajectory: /a1/exploration/trajectory
  scope: /a1/exploration/scope
  roi: /a1/exploration/roi

actions:
  explore_floor: /a1/exploration/explore_floor
  move_base: /move_base
  building_behavior: /a1/building_behavior/special

services:
  make_plan: /move_base/make_plan
  # Standard DWAPlannerROS dynamic_reconfigure service. The entry state queries
  # the live config, applies a lower profile, verifies it, and restores the
  # exact snapshot before any indoor frontier is selected.
  dwa_reconfigure: /move_base/DWAPlannerROS/set_parameters

planning:
  # A single empty TCPROS response can occur while move_base cancels a timed
  # out goal and updates both costmaps. Retry it as a transport fault; only a
  # sustained outage is a mission-level navigation failure.
  make_plan_retry_attempts: 3
  make_plan_retry_delay_wall: 0.15
  # move_base is launched with respawn:=true because it segfaulted once in
  # integration_fix19. A restarted move_base needs to rebuild both costmaps
  # before it advertises make_plan again, which takes longer than the previous
  # 10 s budget; this must outlast a restart but still fail a genuine outage.
  make_plan_unavailable_timeout_wall: 30.0

# RECORD_START is the outdoor return pose. floor_entry_pose is a distinct pose
# just inside the public main entrance, with +X pointing into the floor.
entry:
  # The public entrance transit already has a mission-provided, localization-
  # relative axis and independent map/plan safety checks. Do not make it depend
  # on reacquiring a generic Doorway after opening and resetting the floor map;
  # generic doorway perception remains enabled for the four room transactions,
  # while the elevator continues to use its independent L-shaped wall template.
  door_centerline:
    enabled: false
    required: false
    timeout_wall: 5.0
    minimum_width: 1.20
    maximum_width: 2.40
    maximum_lateral: 1.20
    minimum_forward: 0.40
    target_forward_margin: 0.60
    minimum_inside_depth: 0.80
    maximum_inside_depth: 2.50
  # Dedicated short-horizon entrance transit. State_RL consumes this body
  # velocity; the explorer never writes leg joint targets.
  transit_speed: 0.80
  # 入口后的电梯侧向扫描：转到能看见电梯的航向。
  # 「转身要多久」是物理问题 → 仿真钟主判据，墙钟 10 倍兜底。
  # ⚠️ 这几个键原先**不在本文件里**，只有代码默认值 30.0 墙钟秒，
  # 所以对配置文件的墙钟扫描看不见它；mf69 死于此。写进来是为了让它可见。
  elevator_scan:
    yaw_timeout_sim: 15.0
    yaw_timeout_wall: 150.0
    yaw_settle_sim: 0.3
  near_field_distance: 0.70
  near_field_half_width: 0.30
  # 堵住时的有界横向重定心。**只在近场闸门已经拒绝通行时才可达**——那条路径
  # 在今天是「站 30 仿真秒然后整轮失败」，所以能正常穿过的轮次一个字节都不受影响。
  #
  # mf62 实测：门洞净宽 **0.90 m**，探测框 ±0.30 m ⇒ 真实横向余量只有 ±0.15 m；
  # 机器人偏心 **0.19 m**、航向 11°，探测框左前角切进门框上沿，30 秒内那 2×2 格
  # 恒为 100 一格未变。闸门是对的——偏心 0.19 m 时机身真的会刮到门框。
  # 而 blocked 分支只发零速并 continue，跳过了下面的航向修正，于是「由姿态偏差
  # 造成的堵塞」永远不可能自行解除。
  #
  # 判据复用 entry_near_field_clear 本身（同一张栅格、同一 occupied_threshold），
  # 只是问它「机身横向挪 d 之后你放不放行」，所以结论不可能与闸门冲突。
  # speed 0.15 是 cmd_mux/guard 既有 max_vel_y 0.30 的一半，未新增任何包线；
  # State_RL_test.cpp 把 linear_y 直接送进策略指令张量，这条通路本来就存在。
  # 次数用尽后抛出的失败与今天完全一致。
  recenter:
    enabled: true
    max_offset: 0.45
    probe_step: 0.05
    speed: 0.15
    # 必须**严格小于** probe_step。mf64 实测：两者同为 0.05 时，搜索给出的最小
    # 偏移就是 ±0.05，而到位判据 |remaining| <= tolerance 在第一次循环就成立，
    # 于是 `entry recentre reached +0.000 m of +0.050 m` —— 一步没走就宣布完成，
    # 重定心退化成空操作（mf64 两次尝试皆是）。那一轮入口能过是靠等地图更新，
    # 不是靠重定心。0.02 给最小偏移留出 2.5 倍的分辨力。
    tolerance: 0.02
    max_attempts: 2
    timeout_sim: 6.0
  # 仿真时间。等入口近场那个显式占据格消失的耐心值 —— 等待期间机器人是**停着的**,
  # 这不是安全门限,只是愿意等多久。
  #
  # 旧值 4.0 的前提是「transient door/step return(瞬时的门/台阶回波)」,这个前提
  # 不成立:主入口门是官方文档写明的**约 25 秒插值过程**(docs/doors-and-elevator.md),
  # 而且 /set_door_state 只用 26 毫秒就返回了,根本没等门动完(mf55: 12.176 请求 →
  # 12.202 返回)。于是机器人在门板还在移动时穿越入口,撞上近场占据格。
  #
  # 实测(都在门响应后约 6.3 秒发生,差别只在走位):
  #   mf54 ✓ 15.420 TRANSIT → 20.124 穿过入口(error 0.428 m)
  #   mf55 ✗ 14.478 TRANSIT → 18.486 撞近场障碍 → 22.678 等满 4 秒放弃
  #   mf53 ✗ 同样死于此
  # 三轮踩中两轮。4 秒对一扇 25 秒的门是数量级不匹配。
  #
  # 30 秒覆盖完整门动作并留余量;地图 0.5 Hz,这是 15 帧新栅格。代价上限是失败时
  # 多等 30 仿真秒,而踩中一次的代价是整轮 40 分钟墙钟。
  obstacle_hold_timeout: 30.0
  # The explorer must not consume a simulator-/scene-derived entry pose.
  # RECORD_START localization plus the robot's initial forward heading defines
  # the public entrance transit axis; the numeric offset is a mission standoff,
  # not a world-coordinate truth pose.
  require_explicit_pose: false
  # move_base accepts the threshold pose at 0.35 m. Leave 0.10 m for mapping
  # and TF sampling skew so a valid, strongly observed entry is not rejected.
  position_tolerance: 0.45
  yaw_tolerance: 0.65
  # The upper-floor anchor is reached by a plain move_base goal, and DWA's
  # xy_goal_tolerance is 0.45 m -- the same number. Gating the elevator exit on
  # 0.45 m rejects arrivals move_base is entitled to call successful (mf08
  # landed at 0.34 m and passed on luck). A failed exit misses by metres.
  elevator_anchor_tolerance: 0.75
  # An elevator-delivered entry axis is dead-reckoned through the car pose at
  # relocalization, the opening alignment and the fixed 95 deg turn, the last
  # of which DWA may finish 0.80 rad (46 deg) short. Room and ROI decisions are
  # all taken in entry-frame coordinates, so the axis must be re-measured from
  # stable walls before exploring. Floor 0 does not need it: its axis is exact.
  #
  # OFF by design, not because it is unproven. The mission manager solves the
  # same problem upstream (corridor_axis.estimate_corridor_axis), and per the
  # 2026-08-03 team split the elevator/transfer chain is owned there. Running
  # both would put one safety rule in two nodes: this one is bounded and
  # fail-open, so it would simply measure ~0 after the mission's correction,
  # but a future reader would not know which one was acting. Turn this on only
  # if the mission-side estimate is withdrawn.
  axis_alignment:
    enabled: false
    # Beyond this the candidate belongs to a different wall family (a cross
    # wall, a room's far side) and must not be allowed to rotate the ROI.
    maximum_correction_rad: 0.61
    minimum_wall_length: 1.00
    radius: 12.0
    # Metres of length-times-confidence evidence required before overriding
    # the declared axis; roughly two solid corridor walls.
    minimum_weight: 2.50
    minimum_walls: 2
    timeout_wall: 8.0
  # OccupancyGrid must show a known-free path this far beyond floor_entry_pose.
  inside_probe_distance: 0.75
  # Livox cannot observe the cell under the robot body. Anchor connectivity at
  # the nearest known-free cell within this finite self-clear neighborhood;
  # unknown cells remain non-traversable.
  anchor_search_radius: 0.60
  # Moving from the threshold into the floor must reveal genuinely new cells in
  # the indoor ROI; a service success alone is not entry evidence.
  minimum_new_known_cells: 20
  # Both the public OccupancyGrid connectivity proof and the pre-motion
  # /move_base/make_plan result must stay inside this entry-local corridor.
  corridor_half_width: 0.75
  plan_endpoint_tolerance: 0.60
  plan_maximum_length_ratio: 1.50
  plan_maximum_length_slack: 0.75
  # Livox evidence shows a floor-height transition across the full entrance
  # The entrance apron has an 8 cm vertical edge.  State_RL needs enough
  # forward momentum for the rear legs to follow the front legs onto it.
  # suppress yaw while crossing the sensor-confirmed straight local corridor.
  # These are temporary DWA maxima, not direct velocity commands; cmd_mux
  # remains the sole /cmd_vel publisher.
  speed_limit:
    enabled: true
    service_wait_wall: 3.0
    max_vel_x: 1.40
    max_vel_y: 0.0
    max_vel_trans: 1.40
    max_vel_theta: 0.01
    # DWA rejects every non-zero trajectory when its live minimum speeds remain
    # above the temporary maxima. Lower the paired minima in the same verified
    # transaction and restore them from the same live snapshot.
    min_vel_trans: 1.25
    min_vel_x: 1.25
    min_vel_theta: 0.0
    sim_time: 0.5

# The ROI is floor-entry-local and covers only the indoor body. The entrance
# channel is a transit region, so it is excluded from frontier extraction,
# coverage denominator, and the no-frontier completion decision.
roi:
  enabled: true
  default_entry_forward_offset: 3.5
  # Floor 0: the anchor stands just inside the public entrance, so the whole
  # floor lies ahead of it. Measured floor extent (run23/run27_04, seed
  # 382835531): 38.3 m of corridor and 16.2 m across.
  # mf65 实测：这个框正在切掉全楼层 **58%** 的待探索边界。
  #   ROI 内 free 84181 格，其中 frontier(邻接未知) 806
  #   ROI 外 free 16224 格，其中 frontier(邻接未知) 1133  = 91.3 m2
  # 逐房间看，component_cells 与 roi_allowed_cells 的差值是 640→1914 格
  # (3.6→10.8 m2)，而房间面积只有 23.5–46.1 m2 —— 每个房间被切掉两成到四成，
  # 且机器人越往深处走切得越多。切完之后房间里生成不出候选，就报
  # no frontier candidate was generated inside the room 退出，
  # 操作员看到的正是「没探索完就出去了」。
  #
  # 旧值 ±8.65 的依据是注释里的「实测 16.2 m across」，但实测可通行区域是
  # **18.4 m** 宽(y -8.56..9.81)，装不下；而且**上层楼的框一直是 ±10.5**
  # (elevator_entry_local_polygon)，同一栋楼一楼却窄 1.85 m，这是不一致不是设计。
  # 后边界从 0 改到 -5：0 正好切在 entry pose 上，把入口内侧那一段也排除了。
  #
  # ROI 不是安全判据 —— 它只决定「允许在哪里找探索目标」，不参与避障、速度或
  # 倾角判断，所以放大它不放宽任何安全门限；上层楼用 ±10.5 已经跑过很多轮。
  default_local_polygon: [-5.0, -10.5, 40.0, -10.5,
                          40.0, 10.5, -5.0, 10.5]
  # Floors 1/2: the anchor is 5 m out of the elevator, part-way down the same
  # floor, so roughly 10 m of building sits *behind* it -- including the
  # elevator lobby. Reusing the floor-0 rectangle silently excluded that
  # region from frontier extraction, the coverage denominator and the
  # no-frontier completion decision. Measured from the mf08 F1 anchor: the
  # floor occupies entry-local x in [-10.1, 28.2], y in [-9.1, 7.2].
  elevator_entry_local_polygon: [-13.0, -10.5, 32.0, -10.5,
                                 32.0, 10.5, -13.0, 10.5]
  boundary_margin: 0.35
  map_boundary_margin: 8.0

controller:
  ready_freshness: 0.35

# The three competition floors share the same four-room layout. A room counts
# only after the complete door -> interior -> 360 scan -> corridor exit
# transaction has succeeded. Set to 0 to restore open-ended frontier/no-goal
# completion for buildings whose room count is unknown.
floor_completion:
  completed_room_count: 4
  # 配额未满时,楼层完成被推迟多久(仿真钟)。
  #
  # 这个配额此前**完全没有约束力**:room_completion_state() 算出的
  # floor_complete 在 choose_frontier 里是被丢弃的(`_complete, revivable = ...`),
  # 唯一的消费点是下面的 post-quota 预算 —— 也就是说配额只能让楼层更早结束,
  # 从来不能阻止它结束。mf72 三楼因此在 **0/4 个房间**的状态下被判定探完,
  # 用时 1.9 仿真秒,覆盖率 8.7%,三个危险源全在 20 m 以外,识别 0 分。
  #
  # 现在把返回值接回来当前置条件。必须有界:如果某层的房门确实识别不出来
  # (例如 ROOMS_PER_FLOOR 与本配置不符),没有兜底就是死循环。到期后照常完成,
  # 但会打一条 logerr 明说这层是带着未满配额收工的。
  #
  # 60 s 的依据:mf72 一楼二楼从第 1 个房间事务到第 4 个分别用了 183 s 和 182 s,
  # 单个房间事务的 transaction_timeout 是 90 s。60 s 足够让一个已识别的房门
  # 被重新调度一次,又不至于在真正无解的楼层上浪费一个时间分(60 s = 1 分)。
  unmet_quota_grace_sim: 60.0
  # 房间配额满足**不等于**这层探完了。
  #
  # mf70 实测：三楼四个房间事务全部成功、配额 4/4、楼层判定完成，而机器人
  # 只走到 world y=19.4，三个危险源分别距它 6.60 / 12.97 / 15.06 m，
  # **一个都没进过相机 5.5 m 的检测范围** —— 识别 1/4，prob 0.25，直接 0 分。
  # 三楼只探了 136.6 仿真秒，二楼探了 246.4 秒。
  #
  # 单层树没有这个配额判据，完成条件就是「没有 frontier 了」，所以不会
  # 在楼层还剩一大半时收工。这里恢复那个语义：配额满足后继续探到 frontier
  # 耗尽，但给一个有界预算，避免在长尾碎片上无限消耗时间分。
  post_quota_budget_sim: 180.0
  post_quota_budget_wall: 1800.0

frontier:

  # --- room transaction (ported 2026-08-04) ---
  # A corridor frontier must clear this before it competes with room work.
  corridor_minimum_score: 1.5
  # Corridor band used by the relaxed selection pass only; must exceed the
  # measured 1.27 m centreline/spawn-line offset so a corridor frontier is
  # never mistaken for an unmatched room mouth.
  relaxed_lateral_threshold: 1.6
  # Settle window gating the NEXT goal after a non-success navigation outcome.
  interstitial_zero_settle_s: 0.5
  # The public entrance is a transit edge, not unexplored indoor space.
  # Once crossed, suppress the narrow doorway band from frontier selection.
  entry_exclusion:
    depth: 1.0
    half_width: 1.25
  min_length: 0.35
  obstacle_clearance: 0.30
  goal_standoff: 0.35
  goal_search_radius: 0.60
  min_goal_distance: 0.45
  max_goal_distance: 9.0
  free_threshold: 20
  occupied_threshold: 65
  information_gain_weight: 1.0
  distance_weight: 0.25
  # Reject tiny local fragments whose information gain is lower than their
  # travel cost. They commonly appear at a just-exited room mouth and cause an
  # unnecessary turn/backout cycle instead of axial corridor progress.
  minimum_score: 0.0
  # A room scan may make the visible main corridor known-free without leaving
  # a frontier component. Continue through that observed free space before
  # accepting no-frontier completion; every probe is checked against the map,
  # ROI and move_base plan and uses no simulator truth.
  corridor_probe:
    enabled: true
    step: 3.0
    clearance: 0.24
    minimum_completed_rooms: 2
    # The probe steps a fixed distance beyond the deepest point reached and
    # always succeeds, so it never enters the failed-goal history and has no
    # natural stopping point -- it walks to the end of the corridor and keeps
    # asking for more. Require it to earn its travel: a probe that reveals
    # fewer than this many new ROI cells is barren, and after this many barren
    # probes in a row probing is retired for the rest of the mission.
    minimum_new_cells: 40
    maximum_barren: 2
  # In a corridor, do not let a long axial frontier dominate open rooms.
  # Treat sufficiently lateral frontiers near the current door station as
  # rooms; visit robot-left first, then robot-right, then continue forward.
  room_priority:
    # 上层楼门厅回退闸门：拒绝 entry-local longitudinal < 0 的目标。
    # 与 mission 侧 upper_floor/corridor_confirm_* 成对生效——交接点必须先被
    # 推进走廊，lon=0 才等于走廊口。五次坠落全在门厅段(y<7.84)，井口对 2-D
    # 栅格是 free(0)，没有别的判据拦得住。一楼(floor_id=0)不启用：下面没有楼层。
    lobby_keepout: true
    # --- room transaction (ported 2026-08-04) ---
    # A room is finished when no reachable frontier remains inside it. These
    # bound that search so one awkward room cannot consume the floor budget --
    # the failure mode mf11 measured with the old 360-degree scan (486 s of sim
    # time, 1.1 m travelled, 628 retries at one door mouth).
    transaction_max_goals: 8
    transaction_timeout: 90.0
    goal_timeout: 25.0
    frontier_min_distance: 0.55
    frontier_minimum_score: -0.5
    door_plane_margin: 0.25
    enabled: true
    lateral_threshold: 1.0
    # The broad left/right openings beside the public entrance belong to the
    # entrance junction. In this observation mode only side openings farther
    # down the main corridor are classified as actual room doors.
    minimum_door_longitudinal: 7.0
    # The generator's standard room opening is 1.20 m. Require matching
    # stable/traversable LiDAR doorway evidence instead of treating every
    # lateral frontier as a room.
    door_minimum_width: 1.0
    door_maximum_width: 1.6
    door_station_tolerance: 1.25
    # Valid room doors lie in the wall band beside the main corridor. Openings
    # detected deep inside a room during its 360-degree scan are not doors on
    # the corridor mission graph.
    door_maximum_lateral: 2.2
    lookahead: 5.0
    backtrack: 2.0
    # A branch is explored from its deepest reachable frontier. Once a goal
    # at this depth succeeds, suppress the whole branch rather than only a
    # 0.7 m circle around one goal.
    station_width: 1.5
    # Associate noisy door centers geometrically before station quantization.
    identity_longitudinal_tolerance: 1.0
    # Two doors on the same side of the corridor are separated ALONG it, never
    # across it, so the lateral term is not what distinguishes them -- it only
    # has to absorb how far one opening's perceived centre wanders between
    # detections. Measured in integration_fix22: the same opening came back as
    # id=12 then id=15 with centres 1.25 m apart laterally, which exceeded the
    # old 0.75 m and split one room into two branches, so the robot entered it
    # twice. The longitudinal term keeps distinct doors distinct.
    identity_lateral_tolerance: 1.50
    completion_depth: 2.0
    # Frontier goals normally stop before unknown space. A side branch needs
    # an explicit room-interior observation point beyond the corridor mouth.
    goal_extension: 0.5
    # The push into the room is shortened until the goal has this much
    # known-free space around it. Without the check the goal lands inside
    # furniture standing just inside the door and move_base burns tens of
    # seconds per attempt in abort/backout cycles.
    goal_clearance: 0.40
    # Official source placement reserves a rectangle immediately inside every
    # room door.  The generator uses 1.55 x +/-1.05 m for a source centre; add
    # the 0.15 m danger-sphere radius so no part of a source can intersect it.
    # This suppresses optional room frontiers/camera gaps only. Door-centre
    # approach, mandatory ingress, exit and corridor probes remain executable.
    source_keepout:
      enabled: true
      depth: 1.70
      half_width: 1.20
    scan_angular_speed: 1.80
    exit_align_tolerance: 0.12
    exit_align_timeout: 10.0
    exit_reobserve_time: 1.0
    # Before rotating, require a fully known-free disc around the robot. If
    # the initial room point hugs a wall, search farther into the open area.
    scan_clearance: 0.78
    scan_search_distance: 2.5
  visited_radius: 0.70
  failed_radius: 0.75
  failure_cooldown: 4.0
  maximum_failures: 2
  empty_confirmations: 3
  # An unchanged persistent map is also valid evidence. This is a dwell on a
  # content fingerprint, not a fixed exploration runtime.
  # 必须**显著长于** failure_cooldown(4.0)，否则冷却中的候选会被当成
  # 「不存在的 frontier」，楼层在候选恢复之前就被判定探完。
  #
  # mf70 三楼实测：走廊 frontier(rolling_long 14.67 m) 在 744.33 进入冷却，
  # 745.23 仍在，745.53 起消失，747.24 判定 EXPLORATION_DONE —— 从候选被拒到
  # 宣布探完只用了 **2.01 仿真秒**，与旧值 2.0 完全吻合。后果：三楼只探到
  # world y=19.4，三个危险源距机器人 6.60/12.97/15.06 m，全部在相机 5.5 m
  # 检测上限之外，识别 1/4 → prob 0.25 → 识别 0 分。
  #
  # 10.0 = 2.5 倍冷却期，让冷却中的候选有机会恢复后被重新评估。
  stable_no_frontier_duration: 10.0
  minimum_free_cells: 100

navigation:
  # navigate()'s no-progress watchdog (ported 2026-08-04). move_base can sit on
  # an unreachable goal publishing nothing until the goal timeout expires;
  # measured 2026-08-01, the robot stood still for 24 s while the status still
  # read NAVIGATING. Rotating on the spot counts as progress.
  no_progress:
    timeout: 20.0
    distance: 0.20
    yaw: 0.35
    # 超出这个半径,原地旋转不再算作前进。mf44 在距目标 8.18 m 处原地转了 53 s,
    # 旋转反复重置看门狗锚点,20 s 超时永远到不了,bounded_backout 一次都没触发。
    # 贴近目标时(<= 该半径)保持旧行为 —— 那是合法的最后对准。
    yaw_progress_radius: 1.00
  # Keep frontier targets outside the combined standoff + move_base acceptance
  # radius. This prevents near-goal turn-in-place oscillation at the entrance.
  xy_goal_tolerance: 0.35
  # Turn-first recovery: DWA normally has min_vel_x=0. If an in-place turn
  # is collision-invalid, back out one bounded step through the behavior mux,
  # stop, and retry the same goal. Never reverse continuously through a hall.
  backout:
    speed: 0.45
    step_distance: 0.35
    max_sim_time: 2.0
    # Retrying the same goal after a backout only pays off when the obstacle
    # was transient. Three retries turned every genuinely awkward goal into a
    # 40 s stall (integration_fix21). One retry keeps the transient case and
    # hands the rest back to frontier selection, which has other candidates.
    max_steps: 1

timeouts:
  prerequisites: 30.0
  navigation_goal: 75.0
  entry_door_wall: 10.0
  entry_transit: 90.0
  # Raised from 15.0: RTF ~0.25 plus FAST-LIO re-convergence (brief LOST/STATIONARY_TRANSLATION_DRIFT flap) needs a longer wait budget for a fresh healthy map generation after entry-door reset.
  entry_map: 45.0
  entry_plan: 15.0
  # At the conservative 0.20 m/s unattended-dev speed, the 40 x 40 m grid
  # diagonal alone needs about 283 s before turns and obstacle detours. This
  # is a fault bound, not an exploration-completion rule.
  return_goal: 480.0
  map_update_wait: 2.0
  # 「建图多久没有健康证据」是物理问题，按**仿真时间**计。
  #
  # 旧值是纯墙钟 3.5 s，mf66 因此误杀整轮：bag 显示 60.08→71.98 期间
  # floor_mapping 全程 MAPPING/healthy、定位全程 TRACKING/HEALTHY，
  # **建图根本没坏**——是探索器进程在 RTF 0.151 下被 CPU 抢占，3.55 墙钟秒
  # 没跑到回调（该轮同时开着 RViz + 前视相机 + 另一个仿真容器）。
  # 而 3.55 墙钟秒只等于 0.54 仿真秒，机器人的物理处境毫无变化。
  #
  # 3.0 仿真秒 = floor_mapping status 的 15 帧（它每 0.2 仿真秒发一次），
  # 真停更时绰绰有余；mf66 那次的 0.54 仿真秒则远不到线。
  # 墙钟 30.0 = 10 倍，容忍 RTF 低到 0.10，且只在 /clock 停摆时才可能先到期。
  # 节点构造时会校验这个 10 倍关系，配错直接拒绝启动。
  mapping_health_grace_sim: 3.0
  mapping_health_grace_wall: 30.0
  # move_base publishes zero at goal completion and cmd_mux then applies its
  # own deceleration/timeout rules. Keep enough wall time for that stop
  # handshake while still requiring a fresh, continuously-zero final output.
  final_zero: 8.0
  # 墙钟兜底相对仿真预算的倍数。它只该在 /clock 卡住时兜底,不该成为主判据。
  #
  # 原注释写「RTF 约 0.3,factor 5 留有余量」——这个前提从未成立。实测 RTF:
  # mf46 0.238 / mf49 0.209 / mf51 0.186 / mf53 0.165,一次都没到过 0.3。
  # factor 5 要求 RTF > 0.20 才能让仿真预算先到期,于是大多数轮次里墙钟兜底
  # 反而先触发,把本来够用的等待提前掐断。mf53 就死在这里:入口占据等待的
  # 预算是 4.0 仿真秒,而 4.0/0.165 = 24.2 墙钟秒 > 20 秒兜底,仿真时间根本
  # 没等满就报 "entry remained explicitly occupied"。
  #
  # mission_manager 侧的同源问题已经修过(navigation_timeout_wall 180 →
  # navigation_timeout_sim 90 + navigation_wall_factor 10,注释写明
  # "10x tolerates RTF down to 0.10")。这里对齐到同一个数。
  # 节点代码里的默认值本来就是 20.0,是这份配置把它压到了 5.0。
  #
  # 这不是放宽安全门限:全部 10 个使用点(等地图/入口通行/入口障碍等待/规划/
  # backout/房间事务/出房间对齐/goal 超时)都是停摆兜底,没有一个是安全判据。
  wall_factor: 10.0

return:
  position_tolerance: 0.40
  yaw_tolerance: 0.65
  maximum_attempts: 2
  zero_velocity_epsilon: 0.01
  zero_settle_time: 0.50
  command_freshness: 0.25
  # RECORD_START's own cell is never observed. floor_mapping is reset the
  # moment the public door opens, the Livox cannot see the ground under the
  # body, and the mission only ever moves forward from the spawn, so that cell
  # stays unknown for the whole run. GlobalPlanner runs with
  # allow_unknown:false, so no plan to it can exist -- measured in
  # integration_fix16: the RECORD_START cell is -1 and everything at x < 0.2 m
  # is unknown, giving "Failed to get a plan" x9. Aim the last MoveBaseAction
  # leg at the nearest known-free cell instead. verify_return_pose() still
  # measures the true RECORD_START, so this cannot relax the return criterion.
  # The anchor is frozen once, at RECORD_START. If the map offers no observed
  # cell close enough, fall back to stepping this far forward along the start
  # heading -- roughly half a body length -- so the anchor sits in ground the
  # robot itself crossed on the way in.
  anchor_search_radius: 0.60
  anchor_margin: 0.10
  anchor_body_setback: 0.30
  # The entry DWA profile pins theta to [0.0, 0.01] and vx to [1.25, 1.40].
  # The outdoor leg needs an in-place turn of about pi plus a low-speed
  # approach, so applying it there makes the leg unexecutable even with a
  # valid plan. The mechanism is kept for its original entrance use.
  use_entry_speed_profile: false
  # The outdoor leg is crossed BACKWARDS on body velocity instead of by
  # MoveBaseAction. Measured in integration_fix18: an in-place turn just
  # outside the doorway injected 2.5 m of phantom lateral translation into the
  # FAST-LIO estimate (yaw and along-axis position stayed accurate), a second
  # turn added 0.9 m, the estimator then re-initialized and re-origined odom,
  # and the action reported "returned within 0.374 m" while the robot stood
  # 17 m from its spawn. Outdoors the only Livox structure is distant ground,
  # a plane that leaves lateral translation unconstrained. Ending the indoor
  # leg on the RECORD_START heading lets the whole crossing happen with no
  # outdoor rotation: bounded reverse vx, bounded lateral vy, and a gentle
  # heading hold, all inside the learned policy's command envelope.
  # Where the indoor leg stops, measured forward from floor_entry_pose into
  # the building. The about-turn is unavoidable (the corridor is walked
  # outward, RECORD_START faces inward); this decides whether it happens
  # somewhere observable. At floor_entry_pose it happened in the doorway,
  # where the 45-degree down-pitched Livox already sees mostly open ground --
  # integration_fix22 drifted 7.6 m from there. Three metres in, the turn is
  # between walls and the whole rest of the return is a straight reverse.
  indoor_anchor_setback: 3.0
  reverse_transit:
    speed: 0.45
    lateral_speed: 0.20
    yaw_speed: 0.35
    align_tolerance: 0.15
    # Now covers roughly 6.5 m of reverse crossing rather than 3.5 m.
    timeout: 90.0
  # Disabled: when the reverse crossing failed in integration_fix22 this
  # fallback let move_base turn in place outdoors, which re-diverged the
  # estimator (7.6 m) and produced a physically wrong "returned" report. A
  # failed return must fail, not flail.
  move_base_outdoor_fallback: false

trajectory:
  sample_period: 0.20
  minimum_step: 0.05
  maximum_poses: 10000

# --- room transaction, ported from the single-floor tree (2026-08-04) ---
# These belong to explore_room_transaction and its helpers, which replace the
# debug scan_room_and_exit. Values are the ones the single-floor tree carried
# through 27 measured rounds; they are not new tuning.
room:
  # Two doorways closer than this along the corridor axis are one door station,
  # not two rooms to cut between.
  station_separation: 3.0
  camera_coverage:
    # Explicitly OFF for now, as in the single-floor tree: an explicit flag
    # rather than required_fraction=0, because 0 would read as "requirement
    # satisfied" and silently look like a pass. Turn on only after multi-floor
    # is reproducible.
    enabled: false
    candidates: 12
    radius: 4.5
    required_fraction: 0.90
