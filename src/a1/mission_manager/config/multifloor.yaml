mission:
  # ⚠️ 墙钟兜底一律取仿真预算的 10 倍(容忍 RTF 低到 0.10)。它只该在 /clock 停摆时
  # 兜底,绝不该成为主判据。实测 RTF: mf46 0.238 / mf49 0.209 / mf51 0.186 / mf53 0.165,
  # 从未达到过任何旧值隐含的前提。旧的 factor 3.0~4.5 要求 RTF > 0.22~0.33,五个配对
  # 无一满足,于是它们成了五颗定时炸弹——mf54 就死于 active_scan 的 90 墙钟秒在
  # RTF 0.165 下只买到 14.85 仿真秒,360 度扫描转到 339.9 度被掐断。
  # 加大这些值不放宽任何安全门限:它们全是停摆兜底,不是速度/倾角/障碍判据。
  floors: [0, 1, 2]
  # Production/full runs must leave this false.  The test launch explicitly
  # ties it to force_floor_complete_after_ingress for elevator-only testing.
  special_test_mode: false
  elevator_id: elevator_main
  # 一层楼探索的总预算。跑一层要多久是物理问题,所以用**仿真秒**;墙钟只兜底
  # /clock 停摆,和上面的 navigation_timeout_sim 同一个形状。
  #
  # 原来是纯墙钟 1800 s,mf56 就死在这:三楼探索只从这个预算里买到 209 仿真秒,
  # 因为那段 RTF 约 0.12(机器上还有另一份仿真在跑);而几分钟前的二楼在 RTF
  # 约 0.25 时用掉了 226.8 仿真秒。一个「能买到多少机器人行为取决于这台机器
  # 当时还在跑什么」的预算,不是预算。
  #
  # 600 仿真秒 = 实测单层最大用量(226.8 s)的 2.6 倍。
  action_timeout_sim: 600.0
  action_timeout_wall_factor: 10.0
  # A navigation goal's budget is spent in SIM seconds: how long a manoeuvre
  # takes is a physical question, not a function of how fast the grading
  # machine happens to be.  Measured on mf46's successful round, the seven
  # navigate() segments took 2.0-33.6 sim s (median 4.6); the elevator lobby
  # approach is the long one at 33.6 s.  90 s is 2.7x that worst case.
  #
  # This used to be navigation_timeout_wall: 180.0.  At mf46's RTF 0.238 that
  # bought 42.8 sim s and the lobby approach cleared it by 9 s.  Turning RViz
  # on for mf47 dropped RTF to 0.186, the same 180 s bought 33.5 sim s, and the
  # mission died on that manoeuvre after 16.5 s.
  navigation_timeout_sim: 90.0
  # Wall-clock backstop as a multiple of the sim budget.  It only bounds a
  # stalled /clock: with a live clock the sim budget always fires first.
  # 10x tolerates RTF down to 0.10.
  navigation_timeout_wall_factor: 10.0
  # 三楼探完、电梯回到一楼，demo 就结束。run() 尾部那段"返回出发点"是占位实现:
  # 它从一楼电梯几何加两个写死的偏移(2.3 m / 3.5 m)重建一个"大概是起点"的位置,
  # 而且至今一轮都没有真正执行过。真正的返航要等 OPTIMIZATION_BACKLOG 第 2 节的
  # T_g(用电梯轿厢做跨 generation 不变量)做出来, 才能把 robot_start 换算到当前
  # 定位代的 map 系。在那之前打开它, 等于让机器人朝一个编造的坐标走。
  #
  # 注意: 关掉返航时 exploration_time 不再符合 PDF 的定义(「完成全覆盖探索并
  # 返回出发点所需的时间」), MISSION_COMPLETE 事件会显式标注 return_to_start_
  # performed=false, 不要拿那个数去对分。
  final_return_to_start: false
  # 探索器和 mission 共用同一个 /move_base。ExploreFloor 一返回,move_base 可能还在
  # PREEMPTING 探索器的上一个 goal,而我们的 SimpleActionClient 的 simple state 已经
  # 是 DONE。此时发 goal 会让 wait_for_result() 立刻返回而 get_state() 给出 ACTIVE(1),
  # 被 navigate() 当成终止状态。mf51 三楼死在这里(715.582 FLOOR_COMPLETE → 同毫秒发 goal
  # → actionlib 报 PREEMPTING/DONE → 716.584 failed state=1);二楼 311.684 报了一模一样
  # 的错却侥幸通过,所以这是时序运气不是某层特有的缺陷。下面是等它回到空闲的预算。
  move_base_handover_timeout_sim: 5.0
  move_base_handover_timeout_wall: 50.0
  service_timeout_wall: 15.0
  localization_recovery_timeout_wall: 45.0
  mapping_recovery_timeout_wall: 30.0
  # Abort a MoveBase goal that produces no meaningful translation for this
  # wall-time bound. Rotation is observed but cannot re-arm the bound forever.
  # 导航看门狗量的是「机器人多久没有靠近目标」——物理问题，按仿真秒计。
  no_progress_timeout_sim: 12.0
  no_progress_timeout_wall: 120.0
  no_progress_distance: 0.15
  no_progress_yaw: 0.35
startup:
  stand_attempt_timeout_wall: 120.0
  localization_timeout_wall: 300.0
  mapping_timeout_wall: 180.0
  fixed_stand_settle_sim_s: 3.0
  # 让地面平面估计收敛之后，再冻结第 0 代的世界锚点。
  #
  # mf64 实测：一楼锚点在 sim 11.430 建立，而 STARTUP_MAPPING_READY 在 11.378
  # —— floor_mapping 只跑了 **0.05 秒**，给出 floor_z = −0.193（站立高 0.193 m）；
  # 二楼锚点在 sim 325 建立，floor_z = −0.325，与跨轮实测站立高 0.289–0.316 吻合。
  # result_manager 每代只认第一个锚点（`if generation in self._anchors: return`），
  # 所以取样过早的那个 floor_z 会被烙进整轮所有一楼检测点的 world z，误差 0.126 m。
  #
  # 有界且非致命：预算耗尽就用当时拿到的值照常建锚，行为与加这段等待之前一致。
  floor_plane_settle_sim: 3.0
  floor_plane_settle_wall: 30.0
  floor_plane_samples: 4
  floor_plane_tolerance: 0.02
entry:
  floor0_forward_offset: 3.5
  # Fixed building: after crossing the public entrance, force one localization-
  # frame transit into the main corridor before frontier completion is valid.
  floor0_corridor_ingress: 8.0
elevator:
  # After fully entering the car, turn on the source floor before calling the
  # elevator.  The target-floor mapper then starts with a view through the
  # already-open doorway instead of the rear wall.
  scan_cmd_vel_topic: /cmd_vel_behavior
  # Match the proven room-scan angular profile: fast while far from target,
  # then bounded closed-loop deceleration near the final doorway heading.
  transfer_turn_max_speed: 1.80
  transfer_turn_min_speed: 0.55
  transfer_turn_gain: 1.80
  transfer_turn_tolerance: 0.20
  transfer_turn_timeout_sim: 20.0
  transfer_turn_timeout_wall: 200.0
  # Deliberately still wall-clock, and deliberately still short.  This one
  # only asks "did the heading error hold inside tolerance rather than sweeping
  # through it".  The post-turn rebound walks that error back OUT of the
  # 0.20 rad band (mf61 transfer 0->1 finished at 0.168 rad and then unwound
  # 0.235 rad more), so lengthening this would re-arm the turn controller
  # against the rebound.  Waiting for the body to stop is a different
  # postcondition and lives in elevator/transfer_settle below, on the sim clock.
  transfer_turn_settle_wall: 0.5
  # Hold still after the turn, before anything samples the pose that anchors
  # the cross-generation map->world transform.
  #
  # mf61 referee truth: after the turn published zero, the body unwound
  # +13.44 / -3.19 / -3.12 deg over roughly the next 6 sim s, always opposite
  # the turn direction.  The estimator sees it too (13.44 estimated against
  # 13.40 truth at t+6 s on transfer 0->1), so the wait can be closed on
  # measurement instead of on faith.  13.47 deg of heading mismatch displaces a
  # source 5 m away by 1.16 m -- past the evaluator's 1.0 m threshold, so every
  # upper-floor detection would miss.
  #
  # minimum_hold_sim 2.0: on transfer 1->2 the estimator's 0.5 s yaw delta dips
  # to 0.16 deg at t+0.5 s while 3.5 deg of unwind is still to come.  The
  # minimum hold is what stops that fluke from ending the wait early.
  # timeout_sim 8.0: the worst measured case (0->1) went quiet at about 3.7 s,
  # so this is a little over 2x it -- and expiry is not a failure, the mission
  # proceeds and publishes the residual.
  # quiescent_yaw_deg 0.25: the measured estimator noise floor over a 0.5 s
  # window with the body provably still is 0.016-0.153 deg across the three
  # transfers, and at the 0.25 deg crossing there was 0.25-0.30 deg of unwind
  # left -- an order of magnitude inside the 3.16 deg that already matched.
  transfer_settle:
    minimum_hold_sim: 2.0
    minimum_hold_wall: 20.0
    timeout_sim: 8.0
    timeout_wall: 80.0
    quiescent_reference_max_age_sim: 0.5
    quiescent_yaw_deg: 0.25
  doorway_min_width: 1.20
  # floor_mapping reports the stable wall-edge span for the 1.4 m elevator
  # opening; repeated runs measure approximately 1.86-1.94 m.
  doorway_max_width: 2.00
  lobby_standoff: 0.85
  # Keep the whole quadruped, including both rear feet, clear of the threshold
  # before the in-car pre-transfer turn.
  car_depth: 1.45
  # Fixed-seed bag evidence at the 6 cm sill: mf25 crossed cleanly while the
  # final command stayed in [0.575, 0.770] m/s; mf30/mf31 stalled at the same
  # contact with positive-command means 0.384/0.379 and maxima below 0.472.
  # Apply this floor only while drive_straight_into_car owns the existing
  # behavior channel.  It does not change ordinary DWA exploration/navigation.
  car_entry_speed_floor: 0.55
  # Never turn a recovery or meaningful steering command into a forward shove.
  car_entry_speed_floor_max_abs_yaw_rate: 0.25
  # mf37 returned to the measured in-car arrival point A, but MoveBase legally
  # stopped 0.361 m short under its 0.45 m XY tolerance.  The base was then only
  # about 0.26 m inside the opening and rolled 96 degrees when the car moved.
  # The successful F0 transfer stood 0.376 m deeper.  Keep A as a measured
  # reference and target A_safe this far farther inward along measured B->A;
  # mission_manager also verifies that the achieved pose passed A's plane.
  upper_transfer_safe_inset: 0.40
  # Upper-floor exploration formally returns to measured corridor point C,
  # then mission_manager reverses the achieved C->B->A topology as two
  # continuous goals. MoveBase's XY tolerance is 0.45 m; these guards admit
  # ordinary terminal error but reject a shortcut from another lobby position.
  upper_return_staging_tolerance: 0.60
  upper_return_heading_tolerance: 0.35
  # 进轿厢后「必须越过原始 A 平面」这条后置条件的容差。
  #
  # 推导而非拍脑袋:DWA 在距 A_safe 的 xy_goal_tolerance(0.45 m)以内就宣布到达
  # 并 latch(latch_xy_goal_tolerance: true),而 A_safe 只比 A 深 0.40 m。
  # 0.40 < 0.45 ⇒ 一次完全合法的停车最多可以停在 A 平面前 **0.05 m**。
  # 原来的判据要求严格越过 A 平面,在最坏情况下数学上就不可满足,能不能过
  # 取决于 DWA 碰巧 latch 在哪 —— mf59 三层全探索完成后,二楼越过了、三楼差
  # 0.02 m,整轮报废。
  #
  # 0.10 m 覆盖 0.05 m 的最坏合法短缺并留一倍余量,且远小于这条检查真正要防的
  # 情形:mf37 短了 0.361 m,机身只有约 0.26 m 在开口内,电梯一动就横滚 96 度。
  upper_transfer_plane_tolerance: 0.10
  # In-place alignment onto a retraced return bearing, performed at corridor
  # point C before the C->B goal is sent.  Deliberately a SEPARATE block from
  # upper_floor/opening_alignment even though the numbers currently match:
  # retuning the in-car opening turn must not be able to change what happens
  # at C.  mf49 fell exactly there -- point C's own yaw looks outward along the
  # corridor, so MoveBase turned the robot ~180 deg on arrival and the C->B
  # goal turned it ~180 deg back, while DWA was already commanding
  # vx 0.41-1.27 m/s (wz peak -1.698).  The body drifted 0.63 m off the
  # outbound-proven track and a foot went over the lobby shaft edge
  # (ground-truth z 2.915 -> 0.057 between 625.5 and 626.5 s).
  #
  # This is an added precondition, not a widened envelope: 0.80 rad/s stays
  # inside the State_RL training band and the 0.55 floor clears its dead zone.
  return_alignment:
    turn_max_speed: 0.80
    turn_min_speed: 0.55
    turn_gain: 1.40
    turn_tolerance: 0.12
    turn_timeout_sim: 10.0
    turn_timeout_wall: 100.0
    turn_settle_wall: 0.5
  detection_timeout_wall: 20.0
  # Generation-local occupancy/wall/door evidence must be recent when it is
  # frozen into an elevator or corridor landmark.
  perception_max_age_sim: 1.5
  # Backward-compatible source for upper_floor/known_free_occupied_threshold.
  align_occupied_threshold: 65
  minimum_height_change: 1.5
  # Dedicated F0 landmark template, evaluated only during the 2.5 m
  # post-entrance right-side scan.  It does not create a generic doorway.
  template_flank_min_length: 0.45
  # One physical flank can merge with the adjacent wall in RANSAC.  Accept a
  # long partner, but require at least one member of the pair to remain short.
  template_flank_max_length: 4.00
  template_short_flank_max_length: 1.10
  # The nominal leaf is narrower, but the mapper observes the outer short-wall
  # edge span at roughly 1.86--1.94 m in this scene.
  template_gap_min_width: 1.55
  template_gap_max_width: 2.10
  # When the far edge merges into the perpendicular shaft side wall, use its
  # tangent projection; r14 measured this boundary interval at about 1.37 m.
  template_corner_gap_min_width: 1.15
  template_corner_gap_max_width: 1.65
  template_wall_angle_tolerance: 0.26
  template_plane_tolerance: 0.30
  template_scan_bearing_tolerance: 0.65
  template_center_tolerance: 0.18
  template_width_tolerance: 0.16
  template_min_observations: 5
  template_min_age_wall: 0.8
upper_floor:
  # Option A: use the generation-local map to find the car's one long opening,
  # turn to it, then take only goals whose entire footprint strip is fresh and
  # known-free. The teleport-preserved body yaw is only provisional: mf32
  # measured it 37.7 deg away from the physical opening.
  known_free_occupied_threshold: 65
  known_free_half_width: 0.22
  opening_alignment:
    # No world/elevator coordinate enters this test. Unknown, occupied and
    # out-of-grid cells stop every footprint-width ray.
    # Map generation can be healthy while the robot footprint is still unknown.
    # mf38 F2 produced only 5.2 sim seconds during the old 20 wall-second window;
    # all 180 opening rays were 0 m.  First wait for a short footprint-wide strip
    # to become known-free, then spend the existing budget on lobe stability.
    map_ready_wait_sim: 10.0
    map_ready_wait_wall: 100.0
    map_ready_probe: 0.10
    # The sensor cannot complete the enclosure behind a stationary body. Before
    # classifying a long-ray lobe, collect one signed 360-degree in-place scan in
    # the current localization generation/session. This is perception motion,
    # not a world-coordinate shortcut; linear velocity remains exactly zero.
    active_scan_speed: 0.65
    active_scan_timeout_wall: 200.0
    active_scan_timeout_sim: 20.0
    active_scan_no_progress_sim: 5.0
    active_scan_no_progress_wall: 50.0
    active_scan_return_tolerance: 0.20
    active_scan_settle_wall: 0.5
    # mf68 死在这里：20 墙钟秒在 RTF 0.151 下只买到 3 仿真秒，而稳定检测
    # 要 3 帧互不相同的地图，地图 0.5 Hz ⇒ 至少 6 仿真秒，先天不可能满足。
    # 15 仿真秒 ≈ 7 帧地图，留一倍余量。
    wait_sim: 15.0
    wait_wall: 150.0
    max_range: 2.75
    ray_count: 180
    min_contrast: 0.80
    minimum_run: 1.40
    # Reject needle-like gaps and open-room/all-direction evidence. mf30/mf32
    # formal maps each showed one stable lobe approximately 26-52 deg wide.
    minimum_lobe_width: 0.14
    maximum_lobe_width: 1.40
    minimum_peak_advantage: 0.40
    # Each sample must have a distinct current-generation OccupancyGrid stamp.
    stable_samples: 3
    stable_tolerance: 0.08
    maximum_correction: 1.05
    # Deliberately remain inside the State_RL training angular envelope while
    # correcting the observed mf32 error. The 0.55 floor clears its dead zone.
    turn_max_speed: 0.80
    turn_min_speed: 0.55
    turn_gain: 1.40
    turn_tolerance: 0.12
    turn_timeout_wall: 100.0
    turn_timeout_sim: 10.0
    turn_settle_wall: 0.5
  # 等地图长出可通行条带：传感器积累是物理过程，按仿真秒计。
  exit_map_wait_sim: 10.0
  exit_map_wait_wall: 100.0
  # Was 0.85. mf20 stalled on the 6 cm floor-1 elevator sill with the command
  # chain intact: /cmd_vel peaked at 0.416 m/s and the robot moved 0.224 m in
  # 4.4 s. The same robot crossed the same band on floor 0 while ENTERING the
  # car at |vx| peak 0.767, mean 0.489 -- one continuous move_base goal instead
  # of a 0.85 m hop. exploration.yaml already records why: "The entrance apron
  # has an 8 cm vertical edge. State_RL needs enough forward momentum for the
  # rear legs to follow the front legs onto it." A goal that short makes DWA
  # decelerate into its tolerance before the rear legs are up.
  #
  # The map proof is unchanged -- a step is still only taken over a strip the
  # grid has shown known-free at footprint width. This only stops chopping a
  # proven strip into momentum-less pieces.
  exit_step_maximum: 2.40
  # Must remain above MoveBase's 0.45 m XY tolerance; achieved progress is also
  # checked after every step.
  # 0.65 was a move_base tolerance floor. It is also, and more importantly, a
  # MOMENTUM floor: DWA decelerates into its goal, so a short goal caps the
  # peak speed, and the 6 cm elevator sill needs the rear legs to follow the
  # front ones onto it. Measured peak |vx| against outcome at that sill:
  #     0.416  mf20 exit step 3      stuck
  #     0.459  mf29 car entry        stuck   (0.65 m step)
  #     0.690  mf25 car entry        crossed (~1.45 m goal)
  #     0.767  mf22 single 2.30 m    crossed
  # The old all-or-nothing step sizing refused short steps by accident and was
  # protective here; the fix for that let them through. 1.40 m makes the floor
  # explicit, so an unprovable step waits for more map instead of taking a run
  # at the sill it cannot finish.
  exit_minimum_goal: 1.40
  # Navigation footprint reaches 0.30 m forward with 0.02 m padding.
  exit_goal_margin: 0.35
  exit_minimum_progress: 0.15
  exit_completion_tolerance: 0.10
  exit_maximum_steps: 10
  # Perpendicular probes choose the corridor from current-map evidence. The
  # range is a measurement cap, not a commanded transit distance.
  corridor_probe_max_range: 5.0
  corridor_minimum_run: 2.0
  corridor_run_margin: 0.60
  # 交接前必须确认走廊双墙（门厅没有一对间距 2.2 m 的平行墙）。没确认就用同一套
  # advance_map_checked 再往前走，预算用尽则响亮失败——换层失败可重试，而把机器人
  # 丢在井口边交接会整轮报废（mf74/mf80 都是交接后 2 秒坠落）。
  corridor_confirm_attempts: 3
  corridor_confirm_step: 2.0
  corridor_confirm_minimum_step: 0.5
  corridor_minimum_advantage: 0.40
  corridor_map_wait_sim: 8.0
  corridor_map_wait_wall: 80.0
  corridor_entry_yaw_tolerance: 0.5
  # ExploreFloor interprets floor_entry_pose as both an ROI anchor and the
  # longitudinal/lateral room axis.  MoveBase's broad goal tolerance is not a
  # sufficient orientation proof, so fit a fresh pair of opposite stable walls
  # after map-probed corridor ingress. Failure is bounded and falls back to the
  # selected probe axis; no simulator/layout truth is used.
  corridor_axis:
    wait_sim: 3.0
    wait_wall: 30.0
    max_age_sim: 1.5
    maximum_correction: 0.65
    parallel_tolerance: 0.30
    minimum_wall_length: 0.70
    minimum_width: 1.50
    maximum_width: 3.60
    maximum_midpoint_distance: 8.0
diagnostics:
  status_topic: /a1/mission_manager/status
  marker_topic: /a1/mission_manager/markers
